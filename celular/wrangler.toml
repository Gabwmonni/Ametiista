# Ametista no celular: app (PWA) + ponte segura entre o celular e o PC.
name = "ametista"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "RELE"
class_name = "Rele"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rele"]

# Segredo compartilhado com o PC (NUVEM_CHAVE no .env). Configure com:
#   npx wrangler secret put CHAVE_PC
