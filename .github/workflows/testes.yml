# Testes automáticos: rodam a cada envio de código, em Windows (onde a Ametista vive) e no celular.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependências (igual ao instalar.bat)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest tests -q -rs
      - name: Busca por significado com o modelo de verdade
        run: python tests/checar_semantica.py
      - name: App de desktop sobe, responde e fala
        run: python tests/checar_desktop.py

  instalador:
    # Roda o instalar.bat de verdade, como o usuário roda (com Enter no "pause" final)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      WHISPER_MODELO: tiny          # só para o teste baixar mais rápido; o padrão continua "small"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: instalar.bat
        shell: cmd
        run: echo.| instalar.bat
      - name: O que o instalador deixou pronto
        shell: cmd
        run: |
          if not exist .env (echo faltou o .env & exit /b 1)
          .venv\Scripts\python.exe -m ametista --versao || exit /b 1
          .venv\Scripts\python.exe -c "from ametista import config as c; import sys; ok = c.VOSK_MODELO.exists() and c.MODELO_VOZ_ID.exists(); print('modelos:', ok); sys.exit(not ok)" || exit /b 1
          .venv\Scripts\python.exe -c "from ametista import autoinicio as a; import sys; print('iniciar com o Windows:', a.ativo()); sys.exit(not a.ativo())" || exit /b 1
          .venv\Scripts\python.exe -c "from ametista import semantica as s; import sys; print('busca por significado:', s.baixar()); sys.exit(not s.pronto())" || exit /b 1
      - name: diagnostico.bat
        shell: cmd
        run: |
          echo.| diagnostico.bat
          type dados\diagnostico.txt
      - name: Instalar de novo (atualização) não quebra nada
        shell: cmd
        run: echo.| instalar.bat

  atualizacao:
    # Atualização de verdade: instala a 1.0 com o instalar.bat dela, usa, copia a 2.0 por cima e roda o instalar.bat novo
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      WHISPER_MODELO: tiny
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Descompactar a 1.0
        shell: pwsh
        run: |
          git archive --format=zip -o "$env:RUNNER_TEMP\v1.zip" 77498e1
          Expand-Archive "$env:RUNNER_TEMP\v1.zip" -DestinationPath C:\Ametista
      - name: instalar.bat da 1.0
        shell: cmd
        working-directory: C:\Ametista
        run: echo.| instalar.bat
      - name: Usar a 1.0 (memória, voz cadastrada, .env)
        shell: cmd
        run: C:\Ametista\.venv\Scripts\python.exe tests\semear_v1.py C:\Ametista
      - name: Copiar a 2.0 por cima
        shell: pwsh
        run: |
          git archive --format=zip -o "$env:RUNNER_TEMP\v2.zip" HEAD
          Expand-Archive "$env:RUNNER_TEMP\v2.zip" -DestinationPath C:\Ametista -Force
      - name: instalar.bat da 2.0
        shell: cmd
        working-directory: C:\Ametista
        run: echo.| instalar.bat
      - name: Nada se perdeu
        shell: cmd
        run: C:\Ametista\.venv\Scripts\python.exe tests\checar_atualizacao.py C:\Ametista

  pasta_no_onedrive:
    # O caso real: a 1.0 instalada em outra pasta e a 2.0 descompactada num caminho longo dentro do OneDrive.
    # O instalar.bat tem que mover para C:\Ametista, instalar lá e trazer a memória da 1.0.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      WHISPER_MODELO: tiny
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar e usar a 1.0 em C:\Ametista-v1
        shell: pwsh
        run: |
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /f | Out-Null   # como num PC de verdade
          git archive --format=zip -o "$env:RUNNER_TEMP\v1.zip" 77498e1
          Expand-Archive "$env:RUNNER_TEMP\v1.zip" -DestinationPath C:\Ametista-v1
          cmd /c "cd /d C:\Ametista-v1 && echo.| instalar.bat"
          C:\Ametista-v1\.venv\Scripts\python.exe tests\semear_v1.py C:\Ametista-v1
          if ($LASTEXITCODE) { exit 1 }
      - name: Descompactar a 2.0 dentro de um OneDrive, num caminho longo
        shell: pwsh
        run: |
          git archive --format=zip -o "$env:RUNNER_TEMP\v2.zip" HEAD
          $pasta = "$env:USERPROFILE\OneDrive - Etec Centro Paula Souza\Documents\projeto-ametista-v2.0"
          Expand-Archive "$env:RUNNER_TEMP\v2.zip" -DestinationPath $pasta
          "PASTA_LONGA=$pasta\ametista" >> $env:GITHUB_ENV
      - name: instalar.bat de lá
        shell: cmd
        env:
          AMETISTA_INSTALAR_SEM_PERGUNTAR: "1"
        run: |
          cd /d "%PASTA_LONGA%"
          echo.| instalar.bat
      - name: Instalou em C:\Ametista, com a memória da 1.0, e liga com o Windows de lá
        shell: cmd
        run: |
          if exist "%PASTA_LONGA%\.venv" (echo instalou na pasta ruim & exit /b 1)
          C:\Ametista\.venv\Scripts\python.exe tests\checar_atualizacao.py C:\Ametista || exit /b 1
          C:\Ametista\.venv\Scripts\python.exe -c "import winreg, sys; k = winreg.OpenKey(winreg.HKEY_CURRENT_USER, r'Software\Microsoft\Windows\CurrentVersion\Run'); v = winreg.QueryValueEx(k, 'Ametista')[0]; print(v); sys.exit('C:\\Ametista\\ametista.pyw' not in v)"

  celular:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Criptografia das notificações push
        run: node --test celular/testes/*.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ponte do celular de ponta a ponta (Worker local)
        working-directory: celular
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm ci --no-audit --no-fund
          echo "CHAVE_PC=chave-de-teste-123" > .dev.vars
          pip install httpx websockets cryptography
          (npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &)
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          python testes/ponta_a_ponta.py || (tail -50 wrangler.log; exit 1)
