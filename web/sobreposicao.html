<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ametista</title>
<link rel="stylesheet" href="/static/sobreposicao.css">
</head>
<body>
  <div id="painel" class="painel" role="dialog" aria-label="Ametista">
    <div class="borda" aria-hidden="true"></div>
    <div class="conteudo">
      <canvas id="rosto" data-transparente="1"></canvas>
      <div class="lado">
        <div class="topo">
          <span id="status" class="status">Ametista</span>
          <span id="origem" class="origem"></span>
        </div>
        <div id="pedido" class="pedido"></div>
        <div id="resposta" class="resposta"></div>
        <form id="formulario" class="formulario">
          <input id="entrada" autocomplete="off" spellcheck="false" placeholder="Pergunte ou peça algo…">
          <button type="button" id="btnMic" title="Falar (Ctrl+Shift+Espaço)" aria-label="Falar">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/rosto.js"></script>
  <script src="/static/sobreposicao.js"></script>
</body>
</html>
